# Local development database. The Next.js app runs on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: quotecue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotecue
    ports:
      - "5432:5432"
    volumes:
      - quotecue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotecue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quotecue-pgdata:
